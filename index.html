<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f2c2f">
  <meta name="description" content="Gerencie seus ingressos de eventos">
  <title>Meus Ingressos</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meus Ingressos">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <header class="header">
      <h1>Meus ingressos</h1>

      <div class="icons">
        <div class="icon">
          <span class="material-symbols-outlined">notifications</span>
        </div>
        <a href="admin.html" class="icon" style="text-decoration:none" aria-label="Área do administrador">
          <span class="material-symbols-outlined">person</span>
        </a>
      </div>
    </header>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" id="tabUpcoming" type="button">Próximos</button>
      <button class="tab" id="tabPast" type="button">Anteriores</button>
    </div>

    <!-- MÊS -->
    <h2 class="month" id="monthLabel">Novembro 2026</h2>

    <a href="ingresso.html" class="event-card" id="eventCard">
      <div class="card-image">
        <img src="assets/best.png" class="thumb" id="eventThumb" alt="Imagem do evento">
        <span class="badge" id="eventBadge">AGORA</span>
      </div>

      <div class="event-info">
        <div class="top-line">
          <span class="date" id="eventData">Domingo, 22</span>
          <span class="date" id="eventHorario">16:00hs</span>
        </div>

        <h3 id="eventNome">Best of Blues and Rock</h3>
        <p id="eventLocal">Auditório do Ibirapuera (Platéia Externa)</p>
      </div>
    </a>

    <p class="empty-state" id="emptyState" hidden>
      Nenhum evento nesta categoria.
      <a href="admin.html">Cadastrar ingresso</a>
    </p>

  </div>

  <script type="module">
    import { resolveData } from './defaults.js';

    const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];

    const card = document.getElementById('eventCard');
    const emptyState = document.getElementById('emptyState');
    const badge = document.getElementById('eventBadge');
    const monthLabel = document.getElementById('monthLabel');
    const tabUpcoming = document.getElementById('tabUpcoming');
    const tabPast = document.getElementById('tabPast');

    let eventDate = null;

    function parseDateBR(value) {
      if (!value) return null;
      const match = String(value).trim().match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})$/);
      if (!match) return null;

      let year = Number(match[3]);
      if (year < 100) year += 2000;

      const date = new Date(year, Number(match[2]) - 1, Number(match[1]));
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function startOfToday() {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function isPast() {
      return Boolean(eventDate) && eventDate.getTime() < startOfToday().getTime();
    }

    function isToday() {
      if (!eventDate) return true;
      const today = startOfToday();
      return eventDate.getTime() === today.getTime();
    }

    function applyTab() {
      const past = isPast();

      tabUpcoming.classList.toggle('active', !past);
      tabPast.classList.toggle('active', past);

      card.hidden = past;
      emptyState.hidden = !past;

      if (past) {
        badge.textContent = 'ENCERRADO';
      } else if (isToday()) {
        badge.textContent = 'AGORA';
      } else {
        badge.textContent = 'EM BREVE';
      }
    }

    function load() {
      const { data } = resolveData();
      const ev = data.evento;

      document.getElementById('eventThumb').src = ev.thumb;
      document.getElementById('eventNome').textContent = ev.nome;
      document.getElementById('eventData').textContent = ev.data;
      document.getElementById('eventHorario').textContent = ev.horario;
      document.getElementById('eventLocal').textContent = ev.local;
      eventDate = parseDateBR(ev.data);

      if (eventDate) {
        monthLabel.textContent = `${MONTHS[eventDate.getMonth()]} ${eventDate.getFullYear()}`;
      }

      applyTab();
    }

    tabUpcoming.addEventListener('click', () => {
      tabUpcoming.classList.add('active');
      tabPast.classList.remove('active');
      card.hidden = isPast();
      emptyState.hidden = !card.hidden;
    });

    tabPast.addEventListener('click', () => {
      tabPast.classList.add('active');
      tabUpcoming.classList.remove('active');
      card.hidden = !isPast();
      emptyState.hidden = !card.hidden;
    });

    load();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('SW registrado'))
        .catch((err) => console.log('SW erro:', err));
    }
  </script>

</body>

</html>
