<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f2c2f">
  <meta name="description" content="Acesso aos ingressos">
  <title>Entrar · Meus Ingressos</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-152.png">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body>

  <main class="login-page">
    <section class="login-card">
      <div class="login-brand">
        <div class="login-icon">
          <span class="material-symbols-outlined">confirmation_number</span>
        </div>
        <h1>Acessar ingressos</h1>
        <p>Digite a senha para entrar. Sem senha, nada é exibido.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="password">SENHA</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar senha">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
        </div>

        <p class="login-error" id="loginError" role="alert" hidden></p>

        <button type="submit" class="btn-login" id="btnLogin">
          <span class="btn-label">Entrar</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <p class="login-note">
        O acesso expira automaticamente. Depois disso, é preciso digitar a senha de novo.
      </p>
      <p class="login-device" id="deviceLabel"></p>
    </section>
  </main>

  <script type="module" src="./login.js"></script>
</body>

</html>
