<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f2c2f">
  <meta name="description" content="Editar ingressos de eventos">
  <title>Editar Ingressos</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meus Ingressos">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="admin.css">
</head>

<body class="auth-pending">

  <div class="container">

    <header class="header">
      <a href="index.html" class="back" aria-label="Voltar">&lt;</a>
      <h1>Editar Ingressos</h1>
      <div class="header-actions">
        <span class="role-badge" id="roleBadge" hidden></span>
        <span class="session-timer" id="sessionTimer" title="Tempo restante da sessão"></span>
        <button class="btn-logout" id="btnLogout" type="button">Sair</button>
      </div>
    </header>

    <p class="data-notice" id="dataNotice" hidden></p>

    <!-- EVENTO -->
    <p class="section-title">Evento</p>

    <div class="field">
      <label for="eventoNome">NOME DO EVENTO</label>
      <input type="text" id="eventoNome" placeholder="Ex: Harry Styles: Together, Together">
    </div>

    <div class="row">
      <div class="field">
        <label for="eventoData">DATA</label>
        <input type="text" id="eventoData" placeholder="Ex: 18/07/2026">
      </div>
      <div class="field">
        <label for="eventoHorario">HORÁRIO</label>
        <input type="text" id="eventoHorario" placeholder="Ex: 20:45hs">
      </div>
    </div>

    <div class="field">
      <label for="eventoLocal">LOCAL</label>
      <input type="text" id="eventoLocal" placeholder="Ex: MorumBis">
    </div>

    <div class="field">
      <label for="eventoThumb">IMAGEM DO EVENTO</label>
      <select id="eventoThumb">
        <option value="assets/new.png">new.png</option>
        <option value="assets/quentro.png">quentro.png</option>
        <option value="assets/stb.png">stb.png</option>
        <option value="__custom">Imagem enviada do dispositivo</option>
      </select>

      <label class="upload-btn" for="eventoThumbFile">
        Enviar imagem do dispositivo
      </label>
      <input type="file" id="eventoThumbFile" accept="image/*" hidden>

      <img id="thumbPreview" alt="Prévia da imagem do evento"
        style="margin-top:10px;width:100%;border-radius:10px;display:none;">
      <p class="upload-hint" id="uploadHint" hidden></p>
    </div>

    <!-- INGRESSOS -->
    <p class="section-title">Ingressos</p>

    <div id="ingressos-list"></div>

    <button class="btn-add" id="btnAdd" type="button">+ Adicionar ingresso</button>

    <button class="btn-save" id="btnSave" type="button">Salvar</button>
    <button class="btn-preview" id="btnPreview" type="button">Pré-visualizar ingresso</button>
    <button class="btn-reset" id="btnReset" type="button">Restaurar ingressos de exemplo</button>

    <!-- SEGURANÇA -->
    <p class="section-title" id="securityTitle">Segurança</p>

    <div class="security-card" id="securityCard">
      <div class="security-head">
        <div>
          <p class="security-title">Dispositivos conectados</p>
          <p class="security-hint">Sessão de 30 min renovada enquanto você usa o painel.</p>
        </div>
        <button class="btn-ghost" id="btnRefreshDevices" type="button">Atualizar</button>
      </div>
      <div class="devices-panel" id="devicesPanel"></div>
    </div>

    <!-- BACKUP -->
    <p class="section-title">Backup</p>

    <div class="backup-card">
      <p class="backup-hint">Os ingressos ficam salvos no servidor e aparecem em todos os aparelhos. Exporte um JSON
        como cópia extra.</p>
      <div class="backup-actions">
        <button class="btn-ghost" id="btnExport" type="button">Exportar JSON</button>
        <label class="btn-ghost" for="importFile">Importar JSON</label>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button class="btn-ghost" id="btnRestoreBackup" type="button">Backup local</button>
        <button class="btn-ghost" id="btnRestoreServerBackup" type="button">Backup do servidor</button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast">Salvo com sucesso!</div>

  <script type="module" src="./admin.js"></script>
</body>

</html>
