<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f2c2f">
  <meta name="description" content="Gerencie seus ingressos de eventos">
  <title>Ingresso</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
  <link rel="apple-touch-icon" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="152x152" href="assets/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="167x167" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meus Ingressos">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-pending">

  <div class="page">

    <!-- ===== CABEÇALHO DO EVENTO ===== -->
    <div class="event-header">
      <a href="index.html" class="back" aria-label="Voltar">&lt;</a>
      <div>
        <h1 id="ingEventoNome">Meu evento</h1>
        <p id="ingEventoInfo">—</p>
      </div>
    </div>

    <!-- ===== CARROSSEL DE INGRESSOS ===== -->
    <div class="carousel">
      <div class="carousel-track" id="carouselTrack"></div>
    </div>

    <!-- Estado vazio -->
    <p class="tickets-empty" id="ticketsEmpty" hidden>
      Nenhum ingresso cadastrado ainda.
      <a href="admin.html">Cadastrar ingressos</a>
    </p>

  </div><!-- fim page -->

  <!-- ===== MODAL "MAIS INFORMAÇÃO" ===== -->
  <div class="modal" id="infoModal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Informações do ingresso</h2>
        <button class="modal-close" type="button" data-close aria-label="Fechar">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
</body>

</html>
